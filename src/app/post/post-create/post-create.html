<mat-card>
    <form
        class="form-container"
        (submit)="addPost(postCreateForm)"
        #postCreateForm="ngForm"
    >
        <mat-form-field class="full-width-field">
            <mat-label>Title</mat-label>
            <input matInput placeholder="title part" name="title" ngModel required>
        </mat-form-field>
        <mat-form-field class="full-width-field">
            <mat-label>Content</mat-label>
            <textarea matInput placeholder="content part" name="content" ngModel></textarea>
        </mat-form-field>
        <div class="button-spacing">
            <button mat-raised-button color="accent" type="submit">Submit</button>
        </div>

    </form>
</mat-card>
