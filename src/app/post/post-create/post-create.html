<mat-card>
    <form [formGroup]="form"
        class="form-container"
        (submit)="addPost()"
    >
        <mat-form-field class="full-width-field">
            <mat-label>Title</mat-label>
            <input matInput placeholder="title part" formControlName="title">
        </mat-form-field>
        <mat-form-field class="full-width-field">
            <mat-label>Content</mat-label>
            <textarea matInput placeholder="content part" formControlName="content"></textarea>
        </mat-form-field>
        <div class="button-spacing">
            <button mat-raised-button color="accent" type="submit">Submit</button>
        </div>

    </form>
</mat-card>
